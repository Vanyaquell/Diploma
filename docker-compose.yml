services:
  postgres:
    image: postgres:16-alpine
    container_name: diploma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: diploma_real_estate
      POSTGRES_USER: diploma_user
      POSTGRES_PASSWORD: diploma_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diploma_user -d diploma_real_estate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
